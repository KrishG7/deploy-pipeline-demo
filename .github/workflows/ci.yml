name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  api:
    name: API lint + tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only-not-secret
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: ci
          PGPASSWORD: ci-only-not-secret
          PGDATABASE: ci

  web:
    name: Web lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: APP_VERSION="$(cat ../VERSION)" npm run build

  images:
    name: Build images (no push)
    needs: [api, web]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: api, context: api }
          - { name: web, context: web }
          - { name: backup, context: deploy/backup }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          build-args: APP_VERSION=ci
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
